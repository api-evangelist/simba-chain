      security:
      - OAuth2AuthorizationCodeBearer: []
    get:
      tags:
      - Roles
      summary: Get Org Scoped Roles
      operationId: get_org_scoped_roles_organisations__organisation_name__roles__get
      parameters:
      - name: organisation_name
