  /organisations/{organisation_name}/roles/{role_id}:
    get:
      tags:
      - Roles
      summary: Get Org Scoped Role
      operationId: get_org_scoped_role_organisations__organisation_name__roles__role_id__get
      parameters:
      - name: organisation_name
