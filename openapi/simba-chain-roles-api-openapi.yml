components:
  schemas:
    Permission:
      properties:
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        service:
          type: string
          title: Service
        resource:
          type: string
          title: Resource
        action:
          type: string
          title: Action
        is_org_scoped:
          type: boolean
          title: Is Org Scoped
        resource_attributes:
          additionalProperties: true
          type: object
          title: Resource Attributes
        urls:
          items:
            type: string
          type: array
          title: Urls
          default: []
        effect:
          $ref: '#/components/schemas/Effect'
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
      type: object
      required:
      - name
      - description
      - service
      - resource
      - action
      - is_org_scoped
      - resource_attributes
      - effect
      title: Permission
      description: A model representing a permission.
    RoleWithoutPermissions:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        name:
          type: string
          title: Name
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        organisation:
          anyOf:
          - $ref: '#/components/schemas/Organisation'
          - type: 'null'
      type: object
      required:
      - name
      title: RoleWithoutPermissions
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Page_RoleWithoutPermissions_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/RoleWithoutPermissions'
          type: array
          title: Items
        total:
          type: integer
          minimum: 0.0
          title: Total
        page:
          type: integer
          minimum: 1.0
          title: Page
        size:
          type: integer
          minimum: 1.0
          title: Size
        pages:
          type: integer
          minimum: 0.0
          title: Pages
      type: object
      required:
      - items
      - total
      - page
      - size
      - pages
      title: Page[RoleWithoutPermissions]
    SystemTypes:
      type: string
      enum:
      - ensure
      - build
      - dpp
      - see
      title: SystemTypes
    CreateCustomSystemRoleInput:
      properties:
        is_org_role:
          type: boolean
          title: Is Org Role
        is_domain_role:
          type: boolean
          title: Is Domain Role
        name:
          type: string
          title: Name
        display_name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Display Name
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Description
        inherited_roles:
          items:
            type: string
          type: array
          title: Inherited Roles
          default: []
        is_global:
          type: boolean
          title: Is Global
      type: object
      required:
      - is_org_role
      - is_domain_role
      - name
      - is_global
      title: CreateCustomSystemRoleInput
    CreateCustomOrgRoleInput:
      properties:
        name:
          type: string
          title: Name
        display_name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Display Name
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Description
        inherited_roles:
          items:
            type: string
          type: array
          title: Inherited Roles
          default: []
      type: object
      required:
      - name
      title: CreateCustomOrgRoleInput
    Organisation:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        name:
          type: string
          title: Name
        display_name:
          type: string
          title: Display Name
        is_domain:
          type: boolean
          title: Is Domain
        system_type:
          anyOf:
          - $ref: '#/components/schemas/SystemTypes'
          - type: 'null'
      type: object
      required:
      - name
      - display_name
      - is_domain
      title: Organisation
      description: 'A model representing an organisation.


        The field `name` is unique.'
    Effect:
      type: string
      enum:
      - allow
      title: Effect
    UpdateCustomRoleInput:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        display_name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Display Name
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Description
        inherited_roles:
          items:
            type: string
          type: array
          title: Inherited Roles
          default: []
      type: object
      title: UpdateCustomRoleInput
    Role:
      properties:
        is_org_role:
          type: boolean
          title: Is Org Role
        is_domain_role:
          type: boolean
          title: Is Domain Role
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        display_name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Display Name
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Description
        is_global:
          type: boolean
          title: Is Global
        is_custom_role:
          type: boolean
          title: Is Custom Role
        organisation:
          anyOf:
          - $ref: '#/components/schemas/Organisation'
          - type: 'null'
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        inherited_roles:
          items:
            type: string
          type: array
          title: Inherited Roles
        permissions:
          items:
            $ref: '#/components/schemas/Permission'
          type: array
          title: Permissions
      type: object
      required:
      - is_org_role
      - is_domain_role
      - name
      - is_global
      - is_custom_role
      - permissions
      title: Role
      description: A model representing a role.
    Page_RoleWithFlags_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/RoleWithFlags'
          type: array
          title: Items
        total:
          type: integer
          minimum: 0.0
          title: Total
        page:
          type: integer
          minimum: 1.0
          title: Page
        size:
          type: integer
