          title: Organisation Id
      - name: order_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: created_at
          title: Order By
      - name: permission__name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Permission  Name
      - name: permission__description
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Permission  Description
      - name: permission__effect
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Permission  Effect
      - name: permission__service
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Permission  Service
      - name: permission__resource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Permission  Resource
      - name: permission__action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Permission  Action
      - name: permission__order_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: created_at
          title: Permission  Order By
