openapi: 3.2.0
info:
  title: Member Service Roles API
  version: 2.10.1
tags:
- name: Roles
paths:
  /roles/:
    get:
      tags:
      - Roles
      summary: Get Roles
      operationId: get_roles_roles__get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Size
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      - name: is_custom_role
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Custom Role
      - name: is_global
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Global
      - name: is_org_role
        in: query
        required: false
