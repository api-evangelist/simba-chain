          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Organisation Id
      - name: order_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: created_at
          title: Order By
      - name: permission__name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Permission  Name
      - name: permission__description
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Permission  Description
      - name: permission__effect
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Permission  Effect
      - name: permission__service
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Permission  Service
      - name: permission__resource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Permission  Resource
      - name: permission__action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Permission  Action
      - name: permission__order_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: created_at
          title: Permission  Order By
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_RoleWithFlags_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2AuthorizationCodeBearer: []
  /roles/{role_id}:
    get:
      tags:
      - Roles
      summary: Get Role
      operationId: get_role_roles__role_id__get
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Role Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2AuthorizationCodeBearer: []
  /custom_system_roles/:
    post:
      tags:
      - Roles
      summary: Create Custom System Role
      operationId: create_custom_system_role_custom_system_roles__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomSystemRoleInput'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                format: uuid
                title: Response Create Custom System Role Custom System Roles  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2AuthorizationCodeBearer: []
  /custom_system_roles/{role_id}:
    put:
      tags:
      - Roles
      summary: Update Custom System Role
      operationId: update_custom_system_role_custom_system_roles__role_id__put
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Role Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomRoleInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                format: uuid
                title: Response Update Custom System Role Custom System Roles  Role Id  Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2AuthorizationCodeBearer: []
    delete:
      tags:
      - Roles
      summary: Delete Custom System Role
      operationId: delete_custom_system_role_custom_system_roles__role_id__delete
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Role Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2AuthorizationCodeBearer: []
  /organisations/{organisation_name}/roles/:
    post:
      tags:
      - Roles
