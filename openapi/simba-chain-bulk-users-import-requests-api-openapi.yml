          - additionalProperties: true
            type: object
          - type: 'null'
          title: Errors
        submitted_by:
          $ref: '#/components/schemas/UserMoniker'
      type: object
      required:
      - status
      - submitted_by
      title: BulkUsersImportRequest
    HTTPValidationError:
      properties:
        detail:
