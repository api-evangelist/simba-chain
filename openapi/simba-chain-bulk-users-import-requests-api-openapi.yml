            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    BulkUsersImportTaskStatus:
      type: string
      enum:
      - pending
      - processing
      - completed
      - errored
      title: BulkUsersImportTaskStatus
    Page_BulkUsersImportRequest_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BulkUsersImportRequest'
          type: array
          title: Items
        total:
          type: integer
          minimum: 0.0
          title: Total
        page:
          type: integer
          minimum: 1.0
          title: Page
        size:
          type: integer
          minimum: 1.0
          title: Size
        pages:
          type: integer
          minimum: 0.0
          title: Pages
      type: object
      required:
      - items
      - total
      - page
      - size
      - pages
      title: Page[BulkUsersImportRequest]
    Body_create_bulk_users_import_request_bulk_users_import_requests__post:
      properties:
        bulk_import_file:
          type: string
          contentMediaType: application/octet-stream
          title: Bulk Import File
      type: object
      required:
      - bulk_import_file
      title: Body_create_bulk_users_import_request_bulk_users_import_requests__post
    UserMoniker:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        email:
          type: string
          format: email
          title: Email
      type: object
      required:
      - email
      title: UserMoniker
  securitySchemes:
    OAuth2AuthorizationCodeBearer:
      type: oauth2
      flows:
