    ClientCredentialParams:
      properties:
        grant_type:
          $ref: '#/components/schemas/GrantTypes'
        client_id:
          type: string
          format: uuid
          title: Client Id
        client_secret:
          type: string
          title: Client Secret
      type: object
      required:
      - grant_type
      - client_id
      - client_secret
      title: ClientCredentialParams
    AuthorizationCodeParams:
