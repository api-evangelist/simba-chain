      - name: state
        in: query
        required: true
        schema:
          type: string
          title: State
      - name: scope
        in: query
        required: true
        schema:
          type: string
          title: Scope
      - name: client_id
        in: query
        required: true
        schema:
          type: string
          title: Client Id
      - name: code_challenge
        in: query
        required: true
        schema:
          type: string
          minLength: 43
          maxLength: 128
          pattern: ^[A-Za-z0-9._~-]+$
          title: Code Challenge
      - name: code_challenge_method
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SupportedCodeChallengeMethods'
      - name: kc_theme
