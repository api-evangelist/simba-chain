  /oauth/token:
    post:
      tags:
      - Authentication
      summary: Get Access Token
      description: '## This endpoint supports the following authorization flows:

        - Authorization Code Flow.

        Example of request body input:

        ```

        {

        "grant_type": "authorization_code",

        "client_id": "string",

        "code": "string",

        "redirect_uri": "string",

        "code_verifier": "string"

        }

        ```


        - Refresh Token FLow.

        Example of request body input:

        ```

        {

        "grant_type": "refresh_token",

        "client_id": "string",

        "refresh_token": "string"

        }

        ```


        - Client Credentials Flow.

        Example of request body input:

        ```

        {

        "grant_type": "client_credentials",

        "client_id": "string",

        "client_secret": "string"

        }

        ```


        - VP Flow.

        Example of request body input:

        ```

        {

        "grant_type": "vc",

        "vp": "dict"

        }

        ```


        - VP Refresh Token FLow.

        Example of request body input:

        ```

        {

        "grant_type": "vc_refresh_token",

        "refresh_token": "string"

        }

        ```


        ## Returns:

        ```

        {

        "access_token": "string",

        "expires_at": 0,

        "token_type": "string",

        "scope": "string",

        "refresh_token": "string",

        "refresh_expires_at": 0,

        "id_token": "string",

        "id_expires_at": 0

        }

        ```'
      operationId: get_access_token_oauth_token_post
      parameters:
      - name: dpop
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Dpop
      - name: jwt_fingerprint
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Jwt Fingerprint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/AuthorizationCodeParams'
              - $ref: '#/components/schemas/RefreshTokenParams'
              - $ref: '#/components/schemas/ClientCredentialParams'
              - $ref: '#/components/schemas/VpParams'
              - $ref: '#/components/schemas/VpRefreshTokenParams'
              - type: string
              title: Params
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
