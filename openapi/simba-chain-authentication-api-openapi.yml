          title: Scope
        refresh_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Refresh Token
        refresh_expires_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Refresh Expires At
        id_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Id Token
        id_expires_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id Expires At
      type: object
      required:
      - access_token
      - expires_at
      - token_type
      title: TokenResponse
    VpRefreshTokenParams:
      properties:
        grant_type:
          $ref: '#/components/schemas/GrantTypes'
