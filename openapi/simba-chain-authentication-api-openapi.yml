          - type: 'null'
          title: Kc Theme
      - name: nonce
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Nonce
      - name: prompt
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt
      - name: response_mode
        in: query
        required: false
        schema:
          anyOf:
