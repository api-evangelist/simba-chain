components:
  schemas:
    OrganisationWithRoles:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        name:
          type: string
          title: Name
        display_name:
          type: string
          title: Display Name
        is_domain:
          type: boolean
          title: Is Domain
        system_type:
          anyOf:
          - $ref: '#/components/schemas/SystemTypes'
          - type: 'null'
        roles:
          items:
            $ref: '#/components/schemas/RoleMinimal'
          type: array
          title: Roles
      type: object
      required:
      - name
      - display_name
      - is_domain
      - roles
      title: OrganisationWithRoles
    SystemTypes:
      type: string
      enum:
      - ensure
      - build
      - dpp
      - see
      title: SystemTypes
    FreshClientCredential:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        simba_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Simba Id
        name:
          type: string
          title: Name
        secret:
          type: string
          title: Secret
      type: object
      required:
      - id
      - name
      - secret
      title: FreshClientCredential
      description: Only time the plain secret is provided, at it's creation
    CreateInviteSubOrgsInput:
      properties:
        organisation_name:
          type: string
          title: Organisation Name
          description: The name of the sub organisation
        role_ids:
          items:
            type: string
            format: uuid
          type: array
          minItems: 0
          title: Role Ids
          description: List of org role ids to assign to user for organisation
          default: []
        role_names:
          items:
            type: string
          type: array
          minItems: 0
          title: Role Names
          description: List of org role names to assign to user for organisation
          default: []
      type: object
      required:
      - organisation_name
      title: CreateInviteSubOrgsInput
    Organisation:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        name:
          type: string
          title: Name
        display_name:
          type: string
          title: Display Name
        is_domain:
          type: boolean
          title: Is Domain
        system_type:
          anyOf:
          - $ref: '#/components/schemas/SystemTypes'
          - type: 'null'
      type: object
      required:
      - name
      - display_name
      - is_domain
      title: Organisation
      description: 'A model representing an organisation.


        The field `name` is unique.'
    Page_ClientCredential_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ClientCredential'
