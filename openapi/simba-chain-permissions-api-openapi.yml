openapi: 3.2.0
info:
  title: Simba Chain Permissions API
  version: '1.0'
  description: 'Operations tagged Permissions across 2 of this provider''s published API definitions: simba-chain-member-service-openapi.json, simba-chain-member-service-validator-openapi.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Permissions
paths:
  /permissions/:
    get:
      tags:
      - Permissions
      summary: Get Permissions
      operationId: get_permissions_permissions__get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Size
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      - name: description
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      - name: effect
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Effect
      - name: service
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Service
      - name: resource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
      - name: order_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: created_at
          title: Order By
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Permission_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2AuthorizationCodeBearer: []
  /permissions/{permission_id}:
    get:
      tags:
      - Permissions
      summary: Get Permission
      operationId: get_permission_permissions__permission_id__get
      parameters:
      - name: permission_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Permission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2AuthorizationCodeBearer: []
  /identity/{simba_id}/permissions/:
    get:
      tags:
      - Permissions
      summary: Get Identity Permissions By Simba Id
      operationId: get_identity_permissions_by_simba_id_identity__simba_id__permissions__get
      parameters:
      - name: simba_id
        in: path
        required: true
        schema:
          type: string
          title: Simba Id
      - name: service
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Service
      - name: resource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
      - name: order_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: created_at
          title: Order By
      - name: org_names__in
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: ''
          title: Org Names  In
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityPermissionItem'
                title: Response Get Identity Permissions By Simba Id Identity  Simba Id  Permissions  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2AuthorizationCodeBearer: []
  /identity_permissions/:
    get:
      tags:
      - Permissions
      summary: Get Identities Permissions
      operationId: get_identities_permissions_identity_permissions__get
      parameters:
      - name: service
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Service
      - name: resource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
      - name: order_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: created_at
          title: Order By
      - name: simba_id
        in: query
        required: true
        schema:
          type: string
          title: Simba Id
      - name: org_names__in
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: ''
          title: Org Names  In
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIdentityPermissions'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sync_permissions/:
    post:
      tags:
      - Permissions
      summary: Sync Permission
      operationId: sync_permission_sync_permissions__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncServicePermissions'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Effect:
      type: string
      enum:
      - allow
