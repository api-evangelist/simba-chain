      - description
      - service
      - resource
      - action
      - is_org_scoped
      - resource_attributes
      - effect
      - org_domain_name
      title: OrgScopedPermission
    Organisation:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
