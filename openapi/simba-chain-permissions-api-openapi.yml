          type: array
          title: Items
        total:
          type: integer
          minimum: 0.0
          title: Total
        page:
          type: integer
          minimum: 1.0
          title: Page
        size:
          type: integer
          minimum: 1.0
          title: Size
        pages:
          type: integer
          minimum: 0.0
          title: Pages
      type: object
      required:
      - items
      - total
      - page
      - size
      - pages
      title: Page[Permission]
    Permission:
      properties:
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        service:
          type: string
          title: Service
        resource:
          type: string
          title: Resource
        action:
          type: string
          title: Action
        is_org_scoped:
          type: boolean
          title: Is Org Scoped
        resource_attributes:
          additionalProperties: true
          type: object
          title: Resource Attributes
        urls:
          items:
            type: string
          type: array
          title: Urls
          default: []
        effect:
          $ref: '#/components/schemas/Effect'
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
      type: object
      required:
      - name
      - description
      - service
      - resource
      - action
      - is_org_scoped
      - resource_attributes
      - effect
      title: Permission
      description: A model representing a permission.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IdentityPermissionItem:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        is_org_scoped:
          type: boolean
          title: Is Org Scoped
        org_domain_name:
          type: string
          title: Org Domain Name
        service:
          type: string
          title: Service
        resource:
          type: string
          title: Resource
        action:
          type: string
          title: Action
      type: object
      required:
      - id
      - name
      - is_org_scoped
      - org_domain_name
      - service
      - resource
      - action
      title: IdentityPermissionItem
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    SystemTypes:
      type: string
      enum:
      - ensure
      - build
      - dpp
      - see
      title: SystemTypes
    OrgScopedPermission:
      properties:
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        service:
          type: string
          title: Service
        resource:
          type: string
          title: Resource
        action:
          type: string
          title: Action
        is_org_scoped:
          type: boolean
          title: Is Org Scoped
        resource_attributes:
          additionalProperties: true
          type: object
          title: Resource Attributes
        urls:
          items:
            type: string
          type: array
          title: Urls
          default: []
        effect:
          $ref: '#/components/schemas/Effect'
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        org_domain_name:
          type: string
