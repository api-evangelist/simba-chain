        is_domain:
          type: boolean
          title: Is Domain
        system_type:
          anyOf:
          - $ref: '#/components/schemas/SystemTypes'
          - type: 'null'
      type: object
      required:
      - name
      - display_name
      - is_domain
      title: Organisation
      description: 'A model representing an organisation.


        The field `name` is unique.'
    SyncRoleInput:
      properties:
        is_org_role:
          type: boolean
          title: Is Org Role
        is_domain_role:
          type: boolean
          title: Is Domain Role
        name:
          type: string
          title: Name
        is_global:
          type: boolean
          title: Is Global
        inherits:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Inherits
          default: []
        permissions:
          items:
            type: string
          type: array
          title: Permissions
      type: object
      required:
      - is_org_role
      - is_domain_role
      - name
      - is_global
      - permissions
      title: SyncRoleInput
      description: A model representing a role to sync.
    GetIdentityPermissions:
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        permissions:
          items:
            $ref: '#/components/schemas/OrgScopedPermission'
          type: array
          title: Permissions
      type: object
      required:
      - identity
      - permissions
      title: GetIdentityPermissions
    SyncServicePermissions:
      properties:
        service:
          type: string
          title: Service
        permissions:
          items:
            $ref: '#/components/schemas/SyncPermissionInput'
          type: array
          title: Permissions
        roles:
          items:
            $ref: '#/components/schemas/SyncRoleInput'
          type: array
          title: Roles
      type: object
      required:
      - service
      - permissions
      - roles
      title: SyncServicePermissions
      description: A model representing a service roles and permission to sync.
    SyncPermissionInput:
      properties:
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        service:
          type: string
          title: Service
        resource:
          type: string
          title: Resource
        action:
          type: string
          title: Action
        is_org_scoped:
          type: boolean
          title: Is Org Scoped
        resource_attributes:
          additionalProperties: true
          type: object
          title: Resource Attributes
        urls:
          items:
            type: string
          type: array
          title: Urls
          default: []
        effect:
          $ref: '#/components/schemas/Effect'
      type: object
      required:
      - name
      - description
      - service
      - resource
      - action
      - is_org_scoped
      - resource_attributes
      - effect
      title: SyncPermissionInput
      description: A model representing a permission to sync.
    Identity:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        simba_id:
          type: string
          title: Simba Id
        urn:
          type: string
          title: Urn
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email
        organisations:
          items:
            $ref: '#/components/schemas/Organisation'
          type: array
          title: Organisations
      type: object
      required:
      - id
      - simba_id
      - urn
      - organisations
      title: Identity
  securitySchemes:
    OAuth2AuthorizationCodeBearer:
      type: oauth2
      flows:
        authorizationCode:
          scopes: {}
          authorizationUrl: https://blocks.simbachain.com/api/member-service-validator/oauth/authorize
          tokenUrl: https://blocks.simbachain.com/api/member-service-validator/oauth/token
