configuration:
  env_vars:
    SIMBA_API_BASE_URL: The Blocks instance base URL, e.g. https://blocks.simbachain.com or a customer's own instance.
    SIMBA_AUTH_BASE_URL: Same as SIMBA_API_BASE_URL for the default Blocks auth provider; the Keycloak host when SIMBA_AUTH_PROVIDER=KC.
    SIMBA_AUTH_CLIENT_ID: The API Secret Key.
    SIMBA_AUTH_CLIENT_SECRET: The API Client Secret.
    SIMBA_AUTH_PROVIDER: Blocks (default) or KC for Keycloak.
    SIMBA_AUTH_REALM: Keycloak realm, e.g. simbachain (Keycloak only).
    SIMBA_HOME: Directory holding the dotenv file when it is not in the project root.
  dotenv_names: ['.simbachain.env', 'simbachain.env', '.env']
  docs: https://docs.simbachain.com/documentation/developer-resources/environmental-variables
  alternative_providers:
    - name: Blocks (built-in)
      note: SIMBA_AUTH_BASE_URL == SIMBA_API_BASE_URL.
    - name: Keycloak
      note: SIMBA_AUTH_PROVIDER=KC with SIMBA_AUTH_REALM; SIMBA_AUTH_BASE_URL points at the Keycloak server.
