description: >-
  First-party SIMBA Chain client libraries, web3 plugins and helper packages. SIMBA
  documents five SDKs (Python, Java, .NET, JavaScript, TypeScript) plus Hardhat and
  Truffle CLI plugins. CURRENCY IS THE FINDING HERE: only the Python line is alive.
  libsimba (PyPI) shipped 1.9.0 on 2026-06-10 and the newer simba-sdk shipped 1.3.7
  on 2026-01-22, and three UI libraries for the DID/VC surface published in Feb 2026 —
  but the documented Java SDK last released 2023-09-06, the TypeScript SDK 2023-03-13,
  the Hardhat plugin 2024-01-09, the Truffle plugin 2023-05-01, and the .NET SDK
  (libSimba.Net) 2019-10-01, seven years behind the platform it wraps. The JavaScript
  SDK repo (libsimba-js) is ARCHIVED on GitHub while the docs still list a JavaScript
  SDK page.
