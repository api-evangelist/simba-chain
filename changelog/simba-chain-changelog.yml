entries:
  - version: v24.1.1
    date: '2024-01-22'
    latest: true
    breaking: true
    highlights:
      - Refactored the dynamic API and the subscription APIs.
      - Implemented OPA middleware authorization and Envoy remote-user authentication.
      - Added a Dapr event publisher and transaction-processed events written to the database.
      - New key adapters for accounts; updated the account API message-signing endpoint.
      - New Django app for public endpoints.
      - Fixed a bug where authenticated users could not view openapi yaml files.
    breaking_notes:
      - Breaking changes on subscription-related endpoints (UI updated to match).
      - Breaking changes on organisation endpoints (UI updated to match).
  - version: v23.9.1
    date: '2023-10-26'
    highlights:
      - Produce an App Template from an existing application; API to deploy a template from a template bundle.
      - Added Dapr to Django.
      - Dark-mode UI enhancements for the Smart Contract Designer.
  - version: v23.8.1
    date: '2023-10-09'
    highlights:
      - Hyperledger Fabric Blocks Listener and the txn-wallet header.
      - New endpoints for blockchain configuration and management within organizations.
      - Asynchronous transactions now re-queue on recoverable errors.
      - Subscriptions extended to include Accounts; webhook-subscription dropdown added.
      - Contract deployment events raised via queues.
      - Quorum migration alert banner introduced.
