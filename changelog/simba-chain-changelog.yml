description: >-
  SIMBA publishes a dated "Release Notes" page for the Blocks platform, organised as collapsible
  entries per calendar release with three sections each — New Features & Improvements, Upgrades &
  Updates, Bug Fixes & Enhancements. THE FINDING IS THE GAP: the newest entry on the page is Blocks
  v24.1.1, dated 22 January 2024. Nine entries are published, all between November 2022 and January
  2024, and nothing has been added in the two and a half years since, even though the platform has
  demonstrably moved on (the live member service reports version 2.10.1, the product has been
  rebranded to SIMBA Trace on the website, and first-party packages shipped as recently as June 2026).
  The changelog does not describe what is running.
