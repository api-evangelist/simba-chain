- aid: simba-chain:simba-chain-platform-service-api
  name: SIMBA Blocks Platform Service (Dynamic Contract API)
  description: >-
    The SIMBA Build dynamic API generator. When a smart contract is deployed into an application, Blocks
    auto-generates REST endpoints for every method and public variable of that contract — POST to invoke,
    GET to query prior invocations — under /v2/apps/{application}/contract/{contract_name}/{method_name}/,
    with a per-application OpenAPI definition and SwaggerUI rendered from the application's overview page.
    Also carries wallet/account creation, file bundles (_bundleHash), off-chain storage, transaction
    validation and the subscription/notification surface. Because the contract shape is generated per
    deployed application, there is no single tenant-independent published OpenAPI; the generated
    definition is reachable only inside an authenticated application. Probed anonymously 2026-08-27:
    HTTP 401 {"detail":"missing-auth-header"}.
  humanURL: https://docs.simbachain.com/documentation/getting-started/dynamic-api-generator
  baseURL: https://blocks.simbachain.com/api/platform-service
