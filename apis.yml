- aid: simba-chain:simba-chain-authentication-api
  name: SIMBA Blocks Authentication Service API
  description: >-
    SIMBA's OAuth 2.0 / OpenID Connect authorization server and token validator (the "member service
    validator"). Publishes an OIDC discovery document and a JWKS, issues tokens over the
    authorization_code, refresh_token and client_credentials grants with PKCE S256, validates external
    tokens for downstream services, and exposes a Verifiable-Presentation challenge endpoint
    (/oauth/vc-secure-session) that binds a W3C DID to a session with an optional DPoP proof header.
    OpenAPI 3.1.0, 22 operations across 15 paths.
  humanURL: https://docs.simbachain.com/documentation/getting-started/obtaining-api-keys
  baseURL: https://blocks.simbachain.com/api/member-service-validator
