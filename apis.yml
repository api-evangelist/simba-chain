- aid: simba-chain:simba-chain-member-service-api
  name: SIMBA Blocks Member Service API
  description: >-
    The organization, user, role, permission and API-credential control plane behind SIMBA Build.
    Creates and manages organisations, domains, invites, org-scoped and custom system roles, bulk user
    imports, device apps and registrations, notification templates, passkeys and TOTP two-factor
    enrolment, and the client_id / client_secret pairs the SIMBA SDKs authenticate with. OpenAPI 3.1.0,
    106 operations across 74 paths, served publicly (unauthenticated spec, OAuth2-protected operations)
    from SIMBA's own hosted Blocks instance.
  humanURL: https://docs.simbachain.com/documentation/simba-build/managing-an-organization
