aid: simba-chain
name: SIMBA Chain
description: >-
  SIMBA Chain is a South Bend, Indiana enterprise data company spun out of the University of Notre Dame
  under U.S. Department of Defense research funding. Its platform — marketed today as SIMBA Trace and
  built on the SIMBA Blocks / Build / Ensure / Insights product suite — turns products, components,
  assets, credentials and organizations into tamper-evident, cryptographically sealed records on
  permissioned blockchains (Ethereum, Hyperledger Fabric, Polygon, Quorum) for supply-chain visibility,
  traceability, digital thread and EU Digital Product Passport compliance. Developers deploy Solidity or
  Chaincode smart contracts through SIMBA Build, which auto-generates a REST API (OpenAPI + SwaggerUI)
  per application, plus a GraphQL query surface, event/notification subscriptions, and DID/Verifiable
  Credential issuance through SIMBA Ensure. Customers include the U.S. Air Force, Boeing, the Defense
  Logistics Agency and the Australian Defence Force.
