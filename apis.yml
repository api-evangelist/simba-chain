  name: SIMBA Blocks Documentation MCP Server
  description: >-
    A live, unauthenticated remote Model Context Protocol server published on SIMBA's own documentation
    host. tools/list returns four tools — searchDocumentation, getPage, askQuestion and sendFeedback —
    that let an agent search, read and ask questions of the SIMBA Blocks documentation. Provided by the
    GitBook documentation platform SIMBA publishes on, and served from docs.simbachain.com.
