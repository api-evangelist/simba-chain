generated: '2026-08-27'
method: searched
source: >-
  https://docs.simbachain.com/documentation/api-reference/common-error-codes — SIMBA publishes a
  complete numeric error-code reference for the Blocks platform API, captured verbatim below.
  Enriched with the response shapes derived from the 4xx entries in
  openapi/simba-chain-member-service-openapi.json and
  openapi/simba-chain-member-service-validator-openapi.json.
description: >-
  SIMBA Blocks returns TWO distinct error envelopes depending on which service answers. The Django
  platform service (the dynamic contract API) returns a JSON:API-shaped
  {"errors":[{"title","status","code","detail"}]} array with SIMBA's own numeric code taxonomy. The
  FastAPI member and authentication services return FastAPI's {"detail": ...} envelope, and 422
  validation failures return {"detail":[{"loc","msg","type","input","ctx"}]}. Neither is RFC 9457
  application/problem+json.
format: vendor
content_type: application/json
rfc9457: false
envelopes:
  - service: platform-service (dynamic contract API, Django)
    shape: '{"errors": [{"title": string, "status": string, "code": string, "detail": string}]}'
    note: >-
      A JSON:API-style errors array. `code` is SIMBA's numeric taxonomy below; `status` repeats the
      HTTP status as a string.
    example_source: https://docs.simbachain.com/documentation/api-reference/common-error-codes
  - service: member-service and member-service-validator (FastAPI)
    shape: '{"detail": string}  |  {"detail": [{"loc": [...], "msg": string, "type": string, "input": any, "ctx": object}]}'
    schemas: [HTTPValidationError, ValidationError]
    observed:
      - status: 401
        body: '{"detail": "missing-auth-header"}'
        probe: 'GET https://blocks.simbachain.com/api/member-service/pingz (anonymous, 2026-08-27)'
      - status: 404
        body: '{"detail": "Not Found"}'
        probe: 'GET https://blocks.simbachain.com/api/member-service/ (anonymous, 2026-08-27)'
      - status: 404
        body: '{"error": "resource not found"}'
        probe: >-
          GET https://blocks.simbachain.com/api/platform-service/openapi.json (anonymous, 2026-08-27)
          — the gateway/platform 404 shape, distinct again from both envelopes above.
status_codes_declared_in_openapi:
  member_service: {200: 87, 201: 11, 204: 8, 422: 101}
  member_service_validator: {200: 19, 201: 1, 422: 14}
  note: >-
    Neither published spec documents a single 4xx response other than 422 — no 401, 403, 404, 409 or
    429 response is declared on any operation, although the services demonstrably return them. This
    is a real contract-quality gap: an agent reading the spec cannot see the failure modes.
